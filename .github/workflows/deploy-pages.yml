name: Deploy GitHub Pages

on:
  push:
    # o GitHub definiu a branch claude/... como default (repo criado vazio).
    # Se renomear para main, pode remover a segunda linha.
    branches: [main, claude/clinica-mais-vida-site-g9zarc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
